# 净利增长策略
name: profit_growth
display_name: 净利增长
description: 关注最新已披露净利润同比增长不低于 10%，并按低成交额构建候选池的深圳主板成长股票
version: "1.0"
category: growth
tags: [growth, net_profit_growth, low_amount, iwencai]
style:
  risk_profile: balanced
  holding_period: medium_term
  execution_style: selective
  market_regime: [risk_on, neutral]
  capital_profile: low_liquidity
  ui_badge: 净增

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
  factor_weights:
    low_amount: 0.65
    stability: 0.20
    value: 0.10
    size: 0.05
  ranking_hints: |
    深圳主板、净利润同比增长不低于 10% 和有效正成交额，是宿主候选池已经严格复核的固定门槛，不得放宽或改写。
    优先关注：
    1. 净利润增长的可持续性，以及低基数、一次性损益和资产处置影响
    2. 最新报告期的时效性和数据完整性
    3. 低成交额带来的流动性不足、交易冲击和停牌风险
    4. 估值、行业景气、盈利质量、公告和新闻上下文之间的冲突
    5. 最终组合是否过度集中于同一行业或题材
  max_output: 20
